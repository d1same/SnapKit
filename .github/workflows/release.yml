name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        run: dotnet publish SnapKit.csproj -c Release -r win-x64 --self-contained -o publish
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/SnapKit.exe -DestinationPath SnapKit-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: SnapKit-win-x64.zip
          generate_release_notes: true
